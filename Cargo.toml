[workspace]
resolver = "2"
members = [
    "crates/eigenstyle-core",
    "crates/eigenstyle-gui",
    "crates/eigenstyle",
    "crates/eigenstyle-tui",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
# Workspace version line: 1.0.0 for the 1.0 release (eigenstyle-gui and
# eigenstyle-tui inherit it). eigenstyle-core is pinned explicitly to
# 0.1.0 in its own manifest — that version is already published on
# crates.io and does not move with this release.
version = "1.0.0"

[workspace.dependencies]
crossterm = "0.28"
gpui-ce = "=0.2.2"
gpui_ce_platform = { version = "=0.1.0", features = ["wayland", "x11"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12"
eigenstyle-core = { version = "0.1.0", path = "crates/eigenstyle-core" }

[profile.release]
lto = false
