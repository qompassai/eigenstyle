[workspace]
resolver = "2"
members = [
    "crates/eigenstyle-core",
    "crates/eigenstyle-gui",
    "crates/eigenstyle",
    "crates/eigenstyle-tui",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
crossterm = "0.28"
gpui-ce = "=0.2.2"
gpui_ce_platform = { version = "=0.1.0", features = ["wayland", "x11"] }
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.12"
eigenstyle-core = { path = "crates/eigenstyle-core" }

[profile.release]
lto = false
