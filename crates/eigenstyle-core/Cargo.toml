[package]
name = "eigenstyle-core"
# Explicit, not workspace-inherited: 0.1.0 is already published on
# crates.io and stays the core line for the workspace 1.0 release.
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Core library for the voice-profile MCP server: corpus store, stylometric fingerprint engine, deterministic draft checker"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# HTTP client for the fetch-a-URL add flow: ureq 2 is blocking, small, and
# rustls-backed by default — the same choice as the estate's research-mcp.
ureq.workspace = true

[lints.clippy]
all = "warn"
